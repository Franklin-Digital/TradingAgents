name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: [self-hosted, Linux, X64]  # mac-pro runner: GitHub-hosted Actions outage 2026-10-05; the DGX runner is ARM64
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Fresh venv per job: the self-hosted runner is persistent and setup-python's
      # interpreter lives in a shared toolcache, so installing into it would let one
      # job's packages satisfy the next job's imports. RUNNER_TEMP is emptied per job.
      - name: Fresh venv for this job
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q

  smoke-install:
    name: clean-install smoke
    runs-on: [self-hosted, Linux, X64]  # mac-pro runner: GitHub-hosted Actions outage 2026-10-05; the DGX runner is ARM64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fresh venv per job: the self-hosted runner is persistent and setup-python's
      # interpreter lives in a shared toolcache, so installing into it would let one
      # job's packages satisfy the next job's imports. RUNNER_TEMP is emptied per job.
      - name: Fresh venv for this job
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: [self-hosted, Linux, X64]  # mac-pro runner: GitHub-hosted Actions outage 2026-10-05; the DGX runner is ARM64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fresh venv per job: the self-hosted runner is persistent and setup-python's
      # interpreter lives in a shared toolcache, so installing into it would let one
      # job's packages satisfy the next job's imports. RUNNER_TEMP is emptied per job.
      - name: Fresh venv for this job
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
      - name: Install ruff
        run: pip install "ruff>=0.15"
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (results/ and worklog/ are excluded via pyproject extend-exclude).
        run: ruff check .
